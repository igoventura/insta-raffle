# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0

# Environment variables and secrets for Firebase App Hosting.
env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://insta-raffle--insta-raffle-36d17.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: INSTAGRAM_CLIENT_ID
    value: "1626686152589910"
    availability:
      - BUILD
      - RUNTIME
  - variable: INSTAGRAM_CONFIG_ID
    value: "1517039070477799"
    availability:
      - BUILD
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: INSTAGRAM_CLIENT_SECRET
    secret: INSTAGRAM_CLIENT_SECRET
    availability:
      - BUILD
      - RUNTIME
